name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK'ni qo'lda, faqat kerakli paketlar bilan o'rnatish
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | head -1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM paketlarini o'rnatish
        run: npm install

      - name: Capacitor'ni sinxronlash
        run: npx cap sync android

      - name: Gradlew'ga ishga tushirish ruxsatini berish
        run: chmod +x android/gradlew

      - name: APK yig'ish (debug, to'g'ridan-to'g'ri tarqatish uchun)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Release keystore'ni tiklash
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: AAB yig'ish (release, Google Play uchun)
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ../release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: xamshira-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB'ni yuklash (Google Play uchun)
        uses: actions/upload-artifact@v4
        with:
          name: xamshira-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
