name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK o'rnatish
        uses: android-actions/setup-android@v3

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM paketlarini o'rnatish
        run: npm install

      - name: Capacitor'ni Android bilan sinxronlash
        run: npx cap sync android

      - name: Gradle'ga ruxsat berish
        run: chmod +x android/gradlew

      - name: APK yig'ish (debug versiya — sinov uchun)
        run: cd android && ./gradlew assembleDebug

      - name: Tayyor APK'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: xamshira-test-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release kaliti sozlanganini tekshirish
        id: check_release
        env:
          HAS_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HAS_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release kalitini tiklash
        if: steps.check_release.outputs.ready == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: AAB yig'ish (Play Market uchun imzolangan versiya)
        if: steps.check_release.outputs.ready == 'true'
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease

      - name: Tayyor AAB'ni saqlash
        if: steps.check_release.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xamshira-test-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
